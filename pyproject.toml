[project]
name = "contractor-plus-mcp"
version = "1.1.0"
description = "Connect Contractor+ to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Contractor+ API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["contractor+", "contractor+ api", "contractor+ mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/contractor-plus-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=contractor-plus"
Source = "https://github.com/cotlet-connect/contractor-plus-mcp"

[project.scripts]
contractor-plus-mcp = "contractor_plus_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"contractor_plus_agent.py" = "contractor_plus_agent.py"

[tool.hatch.build.targets.sdist]
include = ["contractor_plus_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
